name: NPM Publish

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/**'
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && format('issue-{0}-{1}', github.event.issue.number, github.actor) || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    if: github.event_name == 'push' && github.repository == 'monocloud/management-js'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build Packages
        run: pnpm build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'Version Packages'
          title: 'Version Packages'
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Detect version bump
        id: version_bumped
        run: |
          CURRENT_VERSION=$(jq -r .version packages/core/package.json)
          PREVIOUS_VERSION=$(git show HEAD^:packages/core/package.json | jq -r .version)

          echo "Current version:  $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version
        if: steps.version_bumped.outputs.bumped == 'true'
        uses: apexskier/github-semver-parse@v1
        id: semver
        with:
          version: ${{ steps.version_bumped.outputs.version }}

      - name: Extract Core Changelog for Specific Version
        if: steps.version_bumped.outputs.bumped == 'true'
        id: extract_changelog_core
        env:
          TARGET_VERSION: ${{ steps.version_bumped.outputs.version }}
          CHANGELOG_FILE: 'packages/core/CHANGELOG.md'
        run: |
          LOG_CONTENT=$(sed -n "/^## $TARGET_VERSION\$/,/^## /{/^## $TARGET_VERSION\$/d; /^## /d; p;}" $CHANGELOG_FILE)
          CLEAN_LOG_CONTENT=$(echo "$LOG_CONTENT" | sed 's/[ \t]*$//' | sed '/^$/d')
          echo "changelog_content<<EOF" >> $GITHUB_OUTPUT
          echo "$CLEAN_LOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract Management Changelog for Specific Version
        if: steps.version_bumped.outputs.bumped == 'true'
        id: extract_changelog_management
        env:
          TARGET_VERSION: ${{ steps.version_bumped.outputs.version }}
          CHANGELOG_FILE: 'packages/management/CHANGELOG.md'
        run: |
          LOG_CONTENT=$(sed -n "/^## $TARGET_VERSION\$/,/^## /{/^## $TARGET_VERSION\$/d; /^## /d; p;}" $CHANGELOG_FILE)
          CLEAN_LOG_CONTENT=$(echo "$LOG_CONTENT" | sed 's/[ \t]*$//' | sed '/^$/d')
          echo "changelog_content<<EOF" >> $GITHUB_OUTPUT
          echo "$CLEAN_LOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Release Body
        if: steps.version_bumped.outputs.bumped == 'true'
        id: build_body
        env:
          CORE_CHANGELOG: ${{ steps.extract_changelog_core.outputs.changelog_content }}
          MANAGEMENT_CHANGELOG: ${{ steps.extract_changelog_management.outputs.changelog_content }}
        run: |
          body=""

          if [ -n "$CORE_CHANGELOG" ]; then
            body="${body}### 📦 Core"$'\n'"$CORE_CHANGELOG"$'\n\n\n'
          fi

          if [ -n "$MANAGEMENT_CHANGELOG" ]; then
            body="${body}### 💻 Management"$'\n'"$MANAGEMENT_CHANGELOG"$'\n\n'
          fi

          {
            echo 'body<<EOF'
            printf '%s\n' "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version_bumped.outputs.bumped == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version_bumped.outputs.version }}
          prerelease: ${{ !!steps.semver.outputs.prerelease }}
          name: v${{ steps.version_bumped.outputs.version }}
          body: ${{ steps.build_body.outputs.body }}

  snapshot:
    name: Create Snapshot Release
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '!snapshot') && github.repository == 'monocloud/management-js'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Limit to users with write access
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
              if (!['admin', 'write', 'maintain'].includes(data.permission)) {
                core.setFailed(`@${context.actor} lacks write access to this repository`);
              }
            } catch (e) {
              core.setFailed(`@${context.actor} lacks write access to this repository`);
            }

      - name: Get PR Info
        uses: actions/github-script@v8
        id: pr_info
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const headRepo = pr.head.repo ? pr.head.repo.full_name : null;
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (headRepo !== baseRepo) {
              core.setFailed(
                `Snapshot releases are only supported for branches in ${baseRepo}, ` +
                  `not forks (PR head repo: ${headRepo}). Refusing to build and publish untrusted code.`
              );
              return;
            }
            core.setOutput('head_sha', pr.head.sha);

      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr_info.outputs.head_sha }}
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build Packages
        run: pnpm build

      - name: Ensure Snapshot Changeset
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "No pending changesets; creating a temporary patch changeset."
            printf '%s\n' "---" \
              "'@monocloud/management-core': patch" \
              "'@monocloud/management': patch" \
              "---" "" "Snapshot release." > .changeset/temp-snapshot.md
          else
            echo "Using existing changesets to compute the snapshot version."
          fi

      - name: Create Snapshot Version
        run: pnpm changeset version --snapshot canary

      - name: Publish NPM Packages as Canary
        run: pnpm changeset publish --tag canary --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Comment on PR with version
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const packagesDir = path.join(path.resolve('.'), 'packages');

            const packageDirs = fs.readdirSync(packagesDir).filter(item =>
              fs.statSync(path.join(packagesDir, item)).isDirectory()
            );

            const packages = packageDirs
              .map(dir => {
                const packageJsonPath = path.join(packagesDir, dir, 'package.json');
                try {
                  const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
                  if (packageJson.private) {
                    return null;
                  }
                  return {
                    name: packageJson.name || dir,
                    version: packageJson.version || 'unknown',
                  };
                } catch (err) {
                  return null;
                }
              })
              .filter(pkg => pkg !== null);

            let markdown = '# SDK Information\n\n';

            markdown += '## Snapshot Versions\n\n';
            markdown += '| SDK | Version |\n';
            markdown += '|-----|--------|\n';
            packages.forEach(pkg => {
              markdown += `| ${pkg.name} | ${pkg.version} |\n`;
            });

            markdown += '\n## NPM Installation \n\n';
            packages.forEach(pkg => {
              markdown += `### ${pkg.name}\n\n`;
              markdown += `\`\`\`\nnpm i ${pkg.name}@${pkg.version}\n\`\`\`\n\n`;
            });

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Snapshot published! \n\n${markdown}`
            })
